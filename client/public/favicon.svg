<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2d" />
      <stop offset="100%" stop-color="#0b0b12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Background Badge / Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#badgeGrad)" stroke="#d97706" stroke-width="2.5" />
  
  <!-- Magnifying Glass Lens Outer -->
  <circle cx="28" cy="27" r="16" fill="url(#glassGrad)" stroke="url(#goldGrad)" stroke-width="4.5" />
  
  <!-- Glass Reflection Arc -->
  <path d="M19 20 A12 12 0 0 1 34 17" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Magnifying Glass Handle -->
  <line x1="40" y1="39" x2="52" y2="51" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
  <circle cx="53" cy="52" r="2.5" fill="#fde047" />
</svg>